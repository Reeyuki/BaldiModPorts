<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Horo</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <base href="https://cdn.jsdelivr.net/gh/Reeyuki/BaldiModPorts@main/horo/">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Horo Nite 3D</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/horo nite 3d.loader.js";
      var config = {
        dataUrl: buildUrl + "/horo nite 3d.data.br",
        frameworkUrl: buildUrl + "/horo nite 3d.framework.js.br",
        codeUrl: buildUrl + "/horo nite 3d.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Horo Nite 3D",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      // Split-file reconstruction shim: files larger than 20 MB were split
      // into 20 MB chunks (<url>.part00, .part01, ...) to satisfy CDN file
      // size limits. NOTE: despite the ".br" extension, these build files
      // are stored uncompressed (raw UnityWebData1.0 / wasm magic), so plain
      // concatenation reproduces the exact original bytes (verified via
      // SHA-256) and no decompression is needed. Unity keeps requesting the
      // original .br URLs (see config above); only our patched fetch knows
      // they are split.
      (function installSplitFileShim() {
        var SPLIT_FILES = [
          { suffix: "horo nite 3d.data.br", parts: 9, contentType: "application/octet-stream" },
          { suffix: "horo nite 3d.wasm.br", parts: 2, contentType: "application/wasm" },
        ];
        var originalFetch = window.fetch.bind(window);
        function matchSplit(url) {
          var decoded = url;
          try { decoded = decodeURI(url); } catch (e) {}
          for (var i = 0; i < SPLIT_FILES.length; i++) {
            if (decoded.endsWith(SPLIT_FILES[i].suffix)) return SPLIT_FILES[i];
          }
          return null;
        }
        function partName(i) {
          return ".part" + String(i).padStart(2, "0");
        }
        function fetchSplit(originalUrl, entry, onProgress) {
          var partUrls = [];
          for (var i = 0; i < entry.parts; i++) partUrls.push(originalUrl + partName(i));
          var loaded = 0;
          return Promise.all(partUrls.map(function (u, idx) {
            // Parts are plain byte ranges of the original file, so plain
            // concatenation reproduces the original bytes exactly.
            // Use originalFetch directly to bypass this shim (part URLs do
            // not match any split entry anyway).
            return originalFetch(u).then(function (res) {
              if (!res.ok) throw new Error("Failed to download " + u + ": " + res.status);
              return res.arrayBuffer().then(function (buf) {
                loaded++;
                if (onProgress) onProgress(loaded / entry.parts);
                return { idx: idx, buf: buf };
              });
            });
          })).then(function (chunks) {
            chunks.sort(function (a, b) { return a.idx - b.idx; });
            var total = chunks.reduce(function (n, c) { return n + c.buf.byteLength; }, 0);
            var combined = new Uint8Array(total);
            var off = 0;
            chunks.forEach(function (c) {
              combined.set(new Uint8Array(c.buf), off);
              off += c.buf.byteLength;
            });
            return new Response(combined, {
              status: 200,
              headers: {
                "Content-Length": String(combined.byteLength),
                "Content-Type": entry.contentType,
              },
            });
          });
        }
        var patchedFetch = function (url, opts) {
          var urlStr = typeof url === "string" ? url : (url && url.url ? url.url : "");
          var entry = urlStr ? matchSplit(urlStr) : null;
          if (entry && (!opts || !opts.method || opts.method === "GET")) {
            return fetchSplit(urlStr, entry);
          }
          return originalFetch(url, opts);
        };
        window.fetch = patchedFetch;
      })();

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
